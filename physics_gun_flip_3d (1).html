<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flip Shot 3D - Wacky Physics Target Game</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js r128 for 3D rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&family=Inter:wght@600;800&display=swap" rel="stylesheet">
    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #c9bede;
            font-family: 'Fredoka', 'Inter', sans-serif;
        }
        #game-canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: crosshair;
            touch-action: none;
        }
        /* Crisp cartoon text stroke matching screenshot */
        .stroke-text {
            color: #ffffff;
            text-shadow:
                -2px -2px 0 #1a1a1a,
                 2px -2px 0 #1a1a1a,
                -2px  2px 0 #1a1a1a,
                 2px  2px 0 #1a1a1a,
                 0px  3px 0 #1a1a1a;
        }
        .cartoon-box {
            background: #ffffff;
            border: 3px solid #1a1a1a;
            box-shadow: 0 4px 0 #1a1a1a;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        .cartoon-box:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #1a1a1a;
        }
        .cartoon-pill {
            background: #ffffff;
            border: 2.5px solid #1a1a1a;
            box-shadow: 0 3px 0 rgba(0,0,0,0.25);
        }
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            70% { transform: scale(1.08); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop {
            animation: popIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        @keyframes floatHint {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }
        .float-badge {
            animation: floatHint 2s ease-in-out infinite;
        }
    </style>
</head>

    <!-- Level / Scene Picker Modal -->

        </div>

    <script>
        /* ============================================================================
         * 1. REALISTIC SYNTHESIZED SOUND ENGINE (Web Audio API - No External Assets)
         * ============================================================================ */
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.muted = false;
                this.gunshotBuffer = null;
                this.bulletHitBuffer = null;
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) {
                        this.ctx = new AudioCtx();
                        this.buildSampleBuffers();
                    }
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            // Pre-builds high-definition PCM audio buffers matching the two provided audio samples:
            // 1) Realistic Gunshot Blast (~1.05s with supersonic crack, muzzle punch & acoustic room tail)
            // 2) Bullet Impact Hit (~0.28s sharp slap transient + heavy body/asset thud)
            buildSampleBuffers() {
                if (!this.ctx) return;
                const sr = this.ctx.sampleRate;

                // --- SOUND 1: GUN BULLET FIRING SOUND (1.05s) ---
                const gunDur = 1.05;
                const gunLen = Math.floor(sr * gunDur);
                this.gunshotBuffer = this.ctx.createBuffer(2, gunLen, sr);

                for (let ch = 0; ch < 2; ch++) {
                    const data = this.gunshotBuffer.getChannelData(ch);
                    let lp1 = 0, lp2 = 0, bp = 0;
                    let phase = 0;

                    for (let i = 0; i < gunLen; i++) {
                        const t = i / sr;
                        const white = Math.random() * 2 - 1;

                        // 1. Initial mechanical pin & supersonic crack (0 - 14ms)
                        const crackEnv = t < 0.014 ? Math.exp(-t / 0.0032) : 0;
                        const crack = (white * 0.7 + Math.sin(2 * Math.PI * 2600 * t) * 0.5) * crackEnv;

                        // 2. High-pressure gunpowder muzzle blast (0 - 180ms)
                        const blastFreq = 45 + 195 * Math.exp(-t / 0.028);
                        phase += (2 * Math.PI * blastFreq) / sr;
                        const punchEnv = Math.exp(-t / 0.042);
                        const lowPunch = Math.sin(phase) * punchEnv * 1.15;

                        // Filtered broadband explosion noise + acoustic echo tail
                        const cutoff = t < 0.12 ? 0.48 : Math.max(0.06, 0.32 * Math.exp(-(t - 0.12) / 0.35));
                        lp1 += cutoff * (white - lp1);
                        lp2 += cutoff * (lp1 - lp2);
                        bp = lp1 - lp2;

                        // Multi-stage acoustic decay matching recorded gunshot tail
                        const burstEnv = Math.exp(-t / 0.055) * 1.25;
                        const earlyRefl = (t > 0.028 ? Math.exp(-(t - 0.028) / 0.095) * 0.55 : 0) +
                                          (t > 0.065 ? Math.exp(-(t - 0.065) / 0.17) * 0.32 : 0);
                        const reverbTail = Math.exp(-t / 0.24) * 0.18;

                        const rawSample = crack * 1.1 + lowPunch + (lp2 * 0.75 + bp * 0.65) * (burstEnv + earlyRefl + reverbTail);
                        // Soft tape/waveshaper saturation for realistic punch
                        data[i] = Math.tanh(rawSample * 1.65) * 0.92;
                    }
                }

                // --- SOUND 2: BULLET HIT ON MAN BODY OR ASSET SOUND (0.28s) ---
                const hitDur = 0.28;
                const hitLen = Math.floor(sr * hitDur);
                this.bulletHitBuffer = this.ctx.createBuffer(2, hitLen, sr);

                for (let ch = 0; ch < 2; ch++) {
                    const data = this.bulletHitBuffer.getChannelData(ch);
                    let filtA = 0, filtB = 0;
                    let thudPhase = 0;
                    let slapPhase = 0;

                    for (let i = 0; i < hitLen; i++) {
                        const t = i / sr;
                        const white = Math.random() * 2 - 1;

                        // 1. Sharp bullet impact slap/crack transient (0 - 25ms)
                        const slapFreq = 320 + 1650 * Math.exp(-t / 0.0065);
                        slapPhase += (2 * Math.PI * slapFreq) / sr;
                        const slapEnv = Math.exp(-t / 0.0085);
                        const slapWave = (Math.sin(slapPhase) * 0.65 + white * 0.85) * slapEnv;

                        // 2. Heavy meaty/solid sub-bass & mid-bass impact thud (0 - 150ms)
                        const thudFreq = 38 + 160 * Math.exp(-t / 0.024);
                        thudPhase += (2 * Math.PI * thudFreq) / sr;
                        const thudEnv = Math.exp(-t / 0.046);
                        const thudWave = Math.sin(thudPhase) * thudEnv * 1.35;

                        // 3. Damped surface/body impact texture (0 - 220ms)
                        filtA += 0.22 * (white - filtA);
                        filtB += 0.12 * (filtA - filtB);
                        const bodyNoise = (filtA - filtB) * Math.exp(-t / 0.038) * 1.4;

                        const combined = slapWave * 1.15 + thudWave + bodyNoise;
                        data[i] = Math.tanh(combined * 2.1) * 0.95;
                    }
                }
            }

            toggleMute() {
                this.muted = !this.muted;
                return this.muted;
            }

            // Plays the realistic gun bullet firing sound
            playGunshot() {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;
                if (!this.gunshotBuffer) this.buildSampleBuffers();

                const now = this.ctx.currentTime;
                const src = this.ctx.createBufferSource();
                src.buffer = this.gunshotBuffer;
                // Slight natural pitch variation per shot
                src.playbackRate.setValueAtTime(0.97 + Math.random() * 0.06, now);

                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.95, now);

                src.connect(gain);
                gain.connect(this.ctx.destination);
                src.start(now);
            }

            // Plays the bullet hit impact sound when a bullet strikes a man's body or a level asset
            playBulletHit(surfaceType = 'body') {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;
                if (!this.bulletHitBuffer) this.buildSampleBuffers();

                const now = this.ctx.currentTime;
                const src = this.ctx.createBufferSource();
                src.buffer = this.bulletHitBuffer;
                // Slightly deeper thud on body hit, slightly crisper snap on solid prop/asset hit
                const rate = surfaceType === 'body'
                    ? 0.96 + Math.random() * 0.06
                    : 1.06 + Math.random() * 0.08;
                src.playbackRate.setValueAtTime(rate, now);

                const hitGain = this.ctx.createGain();
                hitGain.gain.setValueAtTime(1.0, now);

                src.connect(hitGain);
                hitGain.connect(this.ctx.destination);
                src.start(now);
            }

            // Alias kept for compatibility with enemy knockdown calls
            playEnemyHit() {
                this.playBulletHit('body');
            }

            // Prop or floor bounce sound
            playPropBounce(intensity = 0.5) {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;

                const now = this.ctx.currentTime;
                const vol = Math.min(0.4, Math.max(0.05, intensity * 0.3));
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(110 + Math.random() * 60, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.07);
                gain.gain.setValueAtTime(vol, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.085);
            }

            // Level complete chime
            playVictory() {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;

                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    const now = this.ctx.currentTime + idx * 0.09;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now);
                    gain.gain.setValueAtTime(0.28, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.36);
                });
            }
        }

        const sound = new SoundEngine();

        /* ============================================================================
         * 2. GUN SKINS & LEVEL CONFIGURATIONS
         * ============================================================================ */
        const GUN_SKINS = [
            { name: 'Purple Fade', body: 0x8b68f6, grip: 0xf99b6b, barrel: 0x6b4ce6, accent: 0xffffff },
            { name: 'Golden Deagle', body: 0xfbbf24, grip: 0x27272a, barrel: 0xd97706, accent: 0xfef08a },
            { name: 'Cyber Mint', body: 0x10b981, grip: 0xec4899, barrel: 0x047857, accent: 0xa7f3d0 },
            { name: 'Crimson Viper', body: 0xef4444, grip: 0x1e293b, barrel: 0xb91c1c, accent: 0xfca5a5 },
            { name: 'Cobalt Blaster', body: 0x3b82f6, grip: 0xf59e0b, barrel: 0x1d4ed8, accent: 0x93c5fd }
        ];

        const LEVEL_PRESETS = [
            {
                id: 1,
                displayNum: 51, // Starts with the exact iconic "Level 51" scene from the screenshot!
                title: "Burger & Fries Frenzy",
                wallLeft: 0xc9bede,
                wallRight: 0xb0a4c7,
                floor: 0xedd5e3,
                themeType: 'fastfood'
            },
            {
                id: 2,
                displayNum: 52,
                title: "Gym Weightlifting Chaos",
                wallLeft: 0xbae6fd,
                wallRight: 0x93c5fd,
                floor: 0xfde68a,
                themeType: 'gym'
            },
            {
                id: 3,
                displayNum: 53,
                title: "Construction Tower Mayhem",
                wallLeft: 0xfed7aa,
                wallRight: 0xfdba74,
                floor: 0xe2e8f0,
                themeType: 'construction'
            },
            {
                id: 4,
                displayNum: 54,
                title: "Giant Bakery & Cake Party",
                wallLeft: 0xfbcfe8,
                wallRight: 0xf9a8d4,
                floor: 0xd9f99d,
                themeType: 'bakery'
            },
            {
                id: 5,
                displayNum: 55,
                title: "Circus Acrobat Showdown",
                wallLeft: 0xddd6fe,
                wallRight: 0xc4b5fd,
                floor: 0xfecaca,
                themeType: 'circus'
            },
            {
                id: 6,
                displayNum: 56,
                title: "Tropical Beach & Surf Party",
                wallLeft: 0x99f6e4,
                wallRight: 0x5eead4,
                floor: 0xfef08a,
                themeType: 'beach'
            }
        ];

        /* ============================================================================
         * 3. THREE.JS SCENE, CAMERA & ROOM ENVIRONMENT
         * ============================================================================ */
        const canvas = document.getElementById('game-canvas');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xc9bede);

        const camera = new THREE.PerspectiveCamera(36, window.innerWidth / window.innerHeight, 0.1, 200);
        // Position camera to match the exact diagonal room corner perspective from the screenshot
        const defaultCamPos = new THREE.Vector3(-1.5, 4.6, 21.5);
        const defaultLookAt = new THREE.Vector3(0.5, 2.3, 0);

        /* ============================================================================
         * 4. PHYSICS-DRIVEN 3D PISTOL WITH RECOIL, SPIN & BARREL VECTOR
         * ============================================================================ */
        class PhysicsGun {
            constructor() {
                this.group = new THREE.Group();
                this.skinIndex = 0;
                this.buildMesh();
                scene.add(this.group);

                // Physics state
                this.pos = new THREE.Vector3(-2.1, 2.5, 0);
                this.vel = new THREE.Vector3(0, 0, 0);
                // Match screenshot initial pose: barrel pointing straight up (PI/2)
                this.angle = Math.PI / 2;
                this.angVel = 0;
                this.onGround = false;
                this.recoilScale = 1;
            }

            buildMesh() {
                while (this.group.children.length > 0) {
                    this.group.remove(this.group.children[0]);
                }

                const skin = GUN_SKINS[this.skinIndex];
                const outlineMat = new THREE.MeshBasicMaterial({ color: 0x1a1a1a, side: THREE.BackSide });

                // Gun container oriented so angle = 0 points barrel to +X (Right)
                const model = new THREE.Group();

                // 1. Barrel / Slide (Top horizontal part along X axis)
                const slideGeo = new THREE.BoxGeometry(1.15, 0.34, 0.26);
                const slideMat = new THREE.MeshToonMaterial({ color: skin.body });
                const slide = new THREE.Mesh(slideGeo, slideMat);
                slide.position.set(0.18, 0.18, 0);
                slide.castShadow = true;
                model.add(slide);

                // Cartoon outline on slide
                const slideOutline = new THREE.Mesh(slideGeo.clone().scale(1.08, 1.12, 1.12), outlineMat);
                slideOutline.position.copy(slide.position);
                model.add(slideOutline);

                // Muzzle tip
                const muzzleGeo = new THREE.CylinderGeometry(0.09, 0.09, 0.18, 12);
                muzzleGeo.rotateZ(Math.PI / 2);
                const muzzle = new THREE.Mesh(muzzleGeo, new THREE.MeshToonMaterial({ color: 0x1e293b }));
                muzzle.position.set(0.8, 0.2, 0);
                model.add(muzzle);

                // 2. Grip / Handle (Angled downward)
                const gripGeo = new THREE.BoxGeometry(0.34, 0.72, 0.24);
                const gripMat = new THREE.MeshToonMaterial({ color: skin.grip });
                const grip = new THREE.Mesh(gripGeo, gripMat);
                grip.position.set(-0.22, -0.22, 0);
                grip.rotation.z = 0.22;
                grip.castShadow = true;
                model.add(grip);

                const gripOutline = new THREE.Mesh(gripGeo.clone().scale(1.1, 1.08, 1.12), outlineMat);
                gripOutline.position.copy(grip.position);
                gripOutline.rotation.copy(grip.rotation);
                model.add(gripOutline);

                // White highlight stripe on slide (matching screenshot detail)
                const stripeGeo = new THREE.BoxGeometry(0.45, 0.08, 0.28);
                const stripe = new THREE.Mesh(stripeGeo, new THREE.MeshBasicMaterial({ color: skin.accent }));
                stripe.position.set(0.22, 0.22, 0);
                model.add(stripe);

                // Trigger guard
                const guardGeo = new THREE.TorusGeometry(0.14, 0.035, 8, 16);
                const guard = new THREE.Mesh(guardGeo, new THREE.MeshBasicMaterial({ color: 0x1a1a1a }));
                guard.position.set(0.02, -0.08, 0);
                model.add(guard);

                // Subtle Laser Sight Line so player can time shots cleanly while flipping
                const laserGeo = new THREE.BufferGeometry().setFromPoints([
                    new THREE.Vector3(0.88, 0.2, 0),
                    new THREE.Vector3(14.5, 0.2, 0)
                ]);
                const laserMat = new THREE.LineDashedMaterial({
                    color: 0xff2a6d,
                    dashSize: 0.35,
                    gapSize: 0.25,
                    transparent: true,
                    opacity: 0.65
                });
                const laserLine = new THREE.Line(laserGeo, laserMat);
                laserLine.computeLineDistances();
                model.add(laserLine);

                this.model = model;
                this.group.add(model);
            }

            cycleSkin() {
                this.skinIndex = (this.skinIndex + 1) % GUN_SKINS.length;
                this.buildMesh();
                return GUN_SKINS[this.skinIndex].name;
            }

            reset(x = -2.1, y = 1.05) {
                this.pos.set(x, y, 0);
                this.vel.set(0, 0, 0);
                // Upright barrel pointing up just like the screenshot
                this.angle = Math.PI / 2;
                this.angVel = 0;
                this.onGround = true;
                this.updateTransform();
            }

            getMuzzleWorldData() {
                // Local muzzle offset is (0.85, 0.2, 0)
                const dir = new THREE.Vector3(Math.cos(this.angle), Math.sin(this.angle), 0).normalize();
                const upOffset = new THREE.Vector3(-Math.sin(this.angle), Math.cos(this.angle), 0).multiplyScalar(0.2);
                const muzzlePos = this.pos.clone().add(dir.clone().multiplyScalar(0.85)).add(upOffset);
                return { muzzlePos, dir };
            }

            shoot() {
                const { muzzlePos, dir } = this.getMuzzleWorldData();

                // Apply realistic opposite recoil + upward lift so the gun never gets stuck off-screen
                const recoilStrength = 7.8;
                this.vel.x = -dir.x * recoilStrength;
                this.vel.y = Math.max(5.8, -dir.y * recoilStrength + 6.8);

                // Keep the gun within the playable arena bounds horizontally
                if (this.pos.x < -8.5 && this.vel.x < 0) this.vel.x = 5.5;
                if (this.pos.x > 6.5 && this.vel.x > 0) this.vel.x = -6.0;

                // Spin torque when firing
                this.angVel = -10.2 - Math.random() * 2.5;
                this.onGround = false;
                this.recoilScale = 1.28;

                return { muzzlePos, dir };
            }

            update(dt) {
                // Gravity
                const gravity = -18.5;
                if (!this.onGround) {
                    this.vel.y += gravity * dt;
                }

                // Integrate position and rotation
                this.pos.x += this.vel.x * dt;
                this.pos.y += this.vel.y * dt;
                this.angle += this.angVel * dt;

                // Horizontal arena soft boundaries (invisible elastic walls so gun stays on screen)
                if (this.pos.x < -9.5) {
                    this.pos.x = -9.5;
                    this.vel.x = Math.abs(this.vel.x) * 0.65;
                    this.angVel *= -0.8;
                } else if (this.pos.x > 8.5) {
                    this.pos.x = 8.5;
                    this.vel.x = -Math.abs(this.vel.x) * 0.65;
                    this.angVel *= -0.8;
                }

                // Ceiling cap
                if (this.pos.y > 10.5) {
                    this.pos.y = 10.5;
                    this.vel.y = -Math.abs(this.vel.y) * 0.4;
                }

                // Floor collision & realistic bounce
                const floorY = 0.58;
                if (this.pos.y <= floorY) {
                    this.pos.y = floorY;
                    if (Math.abs(this.vel.y) > 2.2) {
                        sound.playPropBounce(Math.abs(this.vel.y) / 12);
                        this.vel.y = -this.vel.y * 0.42;
                        this.vel.x *= 0.78;
                        this.angVel *= 0.72;
                    } else {
                        this.vel.y = 0;
                        this.vel.x *= 0.86;
                        this.angVel *= 0.82;
                        if (Math.abs(this.angVel) < 0.4 && Math.abs(this.vel.x) < 0.2) {
                            this.onGround = true;
                        }
                    }
                }

                // Recover recoil scale
                this.recoilScale += (1 - this.recoilScale) * 14 * dt;
                this.updateTransform();
            }

            updateTransform() {
                this.group.position.copy(this.pos);
                this.group.rotation.z = this.angle;
                this.group.scale.setScalar(this.recoilScale);
            }
        }

        /* ============================================================================
         * 5. ANIMATED 3D STICKMAN CHARACTER WITH RAGDOLL KNOCKDOWN PHYSICS
         * ============================================================================ */
        class TargetMan {
            constructor(config) {
                this.color = config.color || 0xff1e1e;
                this.task = config.task || 'wave'; // 'lift_bun', 'fries_wave', 'squat', 'dance', 'juggle', 'hammer', 'balance'
                this.basePos = config.position.clone();
                this.pos = config.position.clone();
                this.scale = config.scale || 1.0;
                this.hit = false;

                // Physics velocity & angular velocity when hit by bullet
                this.vel = new THREE.Vector3(0, 0, 0);
                this.rotVel = new THREE.Vector3(0, 0, 0);
                this.limbFlailSpeed = 0;
                this.animTime = Math.random() * 10;
                this.linkedProp = config.linkedProp || null;

                // Realistic fearful eye-tracking & facial expression state
                this.fearLevel = 0.25;
                this.curPupilX = -0.025;
                this.curPupilY = -0.01;
                this.curHeadYaw = 0;
                this.curHeadPitch = 0;
                this.saccadeTimer = Math.random() * 0.4;
                this.saccadeX = 0;
                this.saccadeY = 0;
                this.blinkTimer = 1.2 + Math.random() * 2.5;
                this.blinkProgress = 0;

                this.buildCharacter();
                scene.add(this.group);

            buildCharacter() {
                const skinMat = new THREE.MeshToonMaterial({ color: this.color });
                const outlineMat = new THREE.MeshBasicMaterial({ color: 0x111111, side: THREE.BackSide });

                const addOutlinedPart = (geo, mat, parent, pos) => {
                    const holder = new THREE.Group();
                    if (pos) holder.position.copy(pos);
                    const mesh = new THREE.Mesh(geo, mat);
                    mesh.castShadow = true;
                    const out = new THREE.Mesh(geo.clone().scale(1.12, 1.08, 1.12), outlineMat);
                    holder.add(mesh);
                    holder.add(out);
                    parent.add(holder);
                    return holder;
                };

                this.root = new THREE.Group();
                this.group.add(this.root);

                // Torso (hips at y = 1.05)
                const torsoGeo = new THREE.CylinderGeometry(0.24, 0.20, 0.85, 12);
                this.torso = addOutlinedPart(torsoGeo, skinMat, this.root, new THREE.Vector3(0, 1.35, 0));

                // Chest detail (like the white top detail on the red character in screenshot if lift_bun)
                if (this.task === 'lift_bun') {
                    const chestGeo = new THREE.SphereGeometry(0.12, 10, 10);
                    const whiteMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
                    const cL = new THREE.Mesh(chestGeo, whiteMat);
                    cL.position.set(-0.1, 0.12, 0.2);
                    const cR = new THREE.Mesh(chestGeo, whiteMat);
                    cR.position.set(0.1, 0.12, 0.2);
                    this.torso.add(cL, cR);
                }

                // Head
                const headGeo = new THREE.SphereGeometry(0.27, 18, 18);
                headGeo.scale(0.94, 1.1, 0.94);
                this.head = addOutlinedPart(headGeo, skinMat, this.torso, new THREE.Vector3(0, 0.68, 0));

                // ========================================================================
                // REALISTIC EXPRESSIVE FEARFUL EYES (White Sclera + Solid Black Moving Eyeball)
                // ========================================================================
                const scleraGeo = new THREE.SphereGeometry(0.092, 16, 16);
                scleraGeo.scale(1.0, 1.1, 0.62);
                const socketRingGeo = new THREE.SphereGeometry(0.10, 14, 14);
                socketRingGeo.scale(1.05, 1.14, 0.55);

                const eyeWhiteMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
                const socketMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
                const blackEyeballMat = new THREE.MeshBasicMaterial({ color: 0x000000 });

                // Upper eyelid cap for blinking & wide-eyed terror
                const lidGeo = new THREE.SphereGeometry(0.096, 14, 10, 0, Math.PI * 2, 0, Math.PI * 0.48);
                lidGeo.scale(1.02, 1.08, 0.66);
                const lidMat = new THREE.MeshToonMaterial({ color: this.color });

                const createDetailedEye = (xOffset) => {

                    // Dark cartoon socket outline so the eye pops clearly
                    const socketMesh = new THREE.Mesh(socketRingGeo, socketMat);
                    socketMesh.position.z = -0.006;
                    eyeHolder.add(socketMesh);

                    // Eye surface
                    const scleraMesh = new THREE.Mesh(scleraGeo, eyeWhiteMat);
                    eyeHolder.add(scleraMesh);

                    // Solid Black 3D Moving Eyeball Unit (tracks the gun across the eye surface)
                    const pupilUnit = new THREE.Group();
                    pupilUnit.position.set(0, 0, 0.052);

                    const irisGeo = new THREE.SphereGeometry(0.048, 14, 14);
                    irisGeo.scale(1.0, 1.05, 0.45);
                    const irisMesh = new THREE.Mesh(irisGeo, blackEyeballMat);

                    const pupilGeo = new THREE.SphereGeometry(0.042, 14, 14);
                    pupilGeo.scale(1.0, 1.05, 0.5);
                    const pupilMesh = new THREE.Mesh(pupilGeo, blackEyeballMat);
                    pupilMesh.position.z = 0.003;

                    // Subtle tiny specular reflection dot on the black eyeball
                    const glintMesh = new THREE.Mesh(new THREE.CircleGeometry(0.009, 10), eyeWhiteMat);
                    glintMesh.position.set(0.014, 0.015, 0.022);

                    pupilUnit.add(irisMesh, pupilMesh, glintMesh);
                    eyeHolder.add(pupilUnit);

                    // Upper Eyelid
                    const eyelid = new THREE.Mesh(lidGeo, lidMat);
                    eyelid.rotation.x = -0.55; // Retracted by default
                    eyeHolder.add(eyelid);

                    this.head.add(eyeHolder);
                    return { eyeHolder, pupilUnit, pupilMesh, irisMesh, glintMesh, eyelid };
                };

                this.leftEyeObj = createDetailedEye(-0.102);
                this.rightEyeObj = createDetailedEye(0.102);
                this.leftEye = this.leftEyeObj.eyeHolder;
                this.rightEye = this.rightEyeObj.eyeHolder;

                // Expressive 3D Eyebrows that tilt into a terrified/pleading arch
                const browGeo = new THREE.BoxGeometry(0.11, 0.026, 0.03);
                const browMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
                this.leftBrow = new THREE.Mesh(browGeo, browMat);
                this.leftBrow.position.set(-0.105, 0.185, 0.235);
                this.rightBrow = new THREE.Mesh(browGeo, browMat);
                this.rightBrow.position.set(0.105, 0.185, 0.235);
                this.head.add(this.leftBrow, this.rightBrow);

                // Expressive 3D Mouth (quivers and opens into a scared "O" when aimed at)
                const mouthGeo = new THREE.CircleGeometry(0.055, 16);
                const mouthMat = new THREE.MeshBasicMaterial({ color: 0x1a0505 });
                this.mouth = new THREE.Mesh(mouthGeo, mouthMat);
                this.mouth.position.set(0, -0.095, 0.242);
                this.mouth.scale.set(0.9, 0.35, 1);
                this.head.add(this.mouth);

                // Animated Nervous Sweat Drop on temple when terrified
                const sweatGeo = new THREE.SphereGeometry(0.032, 10, 10);
                sweatGeo.scale(0.75, 1.35, 0.75);
                const sweatMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });
                this.sweatDrop = new THREE.Mesh(sweatGeo, sweatMat);
                this.sweatDrop.position.set(-0.23, 0.16, 0.12);
                this.sweatDrop.visible = false;
                this.head.add(this.sweatDrop);

                // Arms (Left & Right Pivots at Shoulders)
                this.leftArmPivot = new THREE.Group();
                this.leftArmPivot.position.set(-0.28, 0.34, 0);
                this.torso.add(this.leftArmPivot);
                const armGeo = new THREE.CylinderGeometry(0.075, 0.065, 0.72, 10);
                armGeo.translate(0, -0.32, 0);
                addOutlinedPart(armGeo, skinMat, this.leftArmPivot);

                this.rightArmPivot = new THREE.Group();
                this.rightArmPivot.position.set(0.28, 0.34, 0);
                this.torso.add(this.rightArmPivot);
                addOutlinedPart(armGeo, skinMat, this.rightArmPivot);

                // Legs (Left & Right Pivots at Hips)
                this.leftLegPivot = new THREE.Group();
                this.leftLegPivot.position.set(-0.15, -0.4, 0);
                this.torso.add(this.leftLegPivot);
                const legGeo = new THREE.CylinderGeometry(0.09, 0.07, 0.92, 10);
                legGeo.translate(0, -0.44, 0);
                addOutlinedPart(legGeo, skinMat, this.leftLegPivot);

                this.rightLegPivot = new THREE.Group();
                this.rightLegPivot.position.set(0.15, -0.4, 0);
                this.torso.add(this.rightLegPivot);
                addOutlinedPart(legGeo, skinMat, this.rightLegPivot);
            }

            // Real-time 3D Eye Gaze, Saccades, Pupil Dilation/Pinpoint & Fear Expression Controller
            updateEyeTracking(dt, gunObj, activeBullets) {
                if (this.hit || !gunObj) return;

                // 1. Get world position of this character's head
                this.head.getWorldPosition(this._tempHeadWorld);

                // 2. Determine primary threat to watch: closest flying bullet or the flipping gun
                let lookTargetPos = gunObj.pos;
                let bulletPanic = 0;

                if (activeBullets && activeBullets.length > 0) {
                    let minBulletDist = Infinity;
                    for (let i = 0; i < activeBullets.length; i++) {
                        const b = activeBullets[i];
                        const d = b.pos.distanceTo(this._tempHeadWorld);
                        if (d < minBulletDist) {
                            minBulletDist = d;
                            lookTargetPos = b.pos;
                        }
                    }
                    if (minBulletDist < 12) {
                        bulletPanic = THREE.MathUtils.clamp(1.2 - minBulletDist / 10, 0.5, 1.0);
                    }
                }

                // 3. Compute how closely the gun's barrel / laser is pointing at this man
                const { muzzlePos, dir } = gunObj.getMuzzleWorldData();
                const toMan = this._tempHeadWorld.clone().sub(muzzlePos);
                const distToGun = Math.max(0.001, toMan.length());
                const dirToMan = toMan.clone().divideScalar(distToGun);
                const aimAlignment = dir.dot(dirToMan); // 1.0 = laser pointing dead-on at this man

                const aimFear = aimAlignment > 0.65
                    ? THREE.MathUtils.smoothstep(aimAlignment, 0.65, 0.96)
                    : 0;
                const proximityFear = THREE.MathUtils.clamp(1.0 - distToGun / 13.5, 0.2, 0.65);
                const spinFear = (!gunObj.onGround || Math.abs(gunObj.angVel) > 1.2) ? 0.35 : 0;

                const targetFear = Math.min(1.0, Math.max(proximityFear, aimFear, spinFear, bulletPanic));
                // Fast spike when scared, gradual recovery
                const lerpRate = targetFear > this.fearLevel ? 14 : 3.5;
                this.fearLevel += (targetFear - this.fearLevel) * Math.min(1, lerpRate * dt);

                // 4. Calculate 3D Gaze vector from eyes to the gun/bullet
                const gazeDelta = lookTargetPos.clone().sub(this._tempHeadWorld);
                const totalDist = Math.max(0.5, gazeDelta.length());

                // Normalized horizontal (-1 left to +1 right) and vertical (-1 down to +1 up) gaze angles
                const normX = THREE.MathUtils.clamp(gazeDelta.x / (totalDist * 0.85), -1, 1);
                const normY = THREE.MathUtils.clamp(gazeDelta.y / (totalDist * 0.85), -1, 1);

                // 5. Biological micro-saccades (rapid subtle eye darting between gun barrel & handle)
                this.saccadeTimer -= dt;
                if (this.saccadeTimer <= 0) {
                    this.saccadeTimer = (0.12 + Math.random() * 0.28) * (1.15 - this.fearLevel * 0.5);
                    const jitterAmp = 0.0045 + this.fearLevel * 0.004;
                    this.saccadeX = (Math.random() - 0.5) * 2 * jitterAmp;
                    this.saccadeY = (Math.random() - 0.5) * 2 * jitterAmp;
                }

                // High-frequency nervous eye tremor when fear is high
                const tremorX = Math.sin(this.animTime * 62) * 0.0032 * this.fearLevel;
                const tremorY = Math.cos(this.animTime * 58) * 0.0032 * this.fearLevel;

                // Target pupil displacement on the sclera hemisphere
                const maxEyeRadiusX = 0.044;
                const maxEyeRadiusY = 0.042;
                const targetPupilX = THREE.MathUtils.clamp(normX * maxEyeRadiusX + this.saccadeX + tremorX, -maxEyeRadiusX, maxEyeRadiusX);
                const targetPupilY = THREE.MathUtils.clamp(normY * maxEyeRadiusY + this.saccadeY + tremorY, -maxEyeRadiusY, maxEyeRadiusY);

                // Snappy realistic eye saccade interpolation
                const eyeSnap = Math.min(1, 24 * dt);
                this.curPupilX += (targetPupilX - this.curPupilX) * eyeSnap;
                this.curPupilY += (targetPupilY - this.curPupilY) * eyeSnap;

                // Curve Z along the front surface of the sclera so pupils follow the 3D eyeball contour
                const rSq = Math.min(0.0022, this.curPupilX * this.curPupilX + this.curPupilY * this.curPupilY);
                const surfaceZ = 0.054 * Math.sqrt(Math.max(0.25, 1 - rSq * 220));
                const pupilRotY = (this.curPupilX / maxEyeRadiusX) * 0.55;
                const pupilRotX = -(this.curPupilY / maxEyeRadiusY) * 0.55;

                [this.leftEyeObj, this.rightEyeObj].forEach((eye) => {
                    eye.pupilUnit.position.set(this.curPupilX, this.curPupilY, surfaceZ);
                    eye.pupilUnit.rotation.set(pupilRotX, pupilRotY, 0);

                    // Terrified pinpoint pupil shrinkage + wide-eyed sclera bulge
                    const pupilShrink = 1.0 - this.fearLevel * 0.36 + Math.sin(this.animTime * 45) * 0.04 * this.fearLevel;
                    eye.pupilMesh.scale.setScalar( THREE.MathUtils.clamp(pupilShrink, 0.55, 1.1) );

                    const eyeBulge = 1.0 + this.fearLevel * 0.24;
                    eye.eyeHolder.scale.set(eyeBulge, eyeBulge * (1 - this.blinkProgress * 0.92), 1.0 + this.fearLevel * 0.15);

                    // Retract upper eyelids in terror or close during natural blink
                    eye.eyelid.rotation.x = -0.45 - this.fearLevel * 0.45 + this.blinkProgress * 1.45;
                });

                // 6. Natural blinking (suppressed when wide-eyed in extreme terror)
                this.blinkTimer -= dt;
                if (this.blinkTimer <= 0 && this.fearLevel < 0.72) {
                    this.blinkProgress = Math.min(1, this.blinkProgress + dt * 18);
                    if (this.blinkProgress >= 1) {
                        this.blinkTimer = 1.8 + Math.random() * 2.6;
                    }
                } else {
                    this.blinkProgress = Math.max(0, this.blinkProgress - dt * 16);
                }

                // 7. Turn Head Partially Toward the Gun + Fearful Head Quiver
                const targetYaw = normX * 0.42 + Math.sin(this.animTime * 40) * 0.03 * this.fearLevel;
                const targetPitch = -normY * 0.30;
                this.curHeadYaw += (targetYaw - this.curHeadYaw) * Math.min(1, 10 * dt);
                this.curHeadPitch += (targetPitch - this.curHeadPitch) * Math.min(1, 10 * dt);

                this.head.rotation.y = this.curHeadYaw;
                this.head.rotation.x = this.curHeadPitch;

                // 8. Worried/Terrified Eyebrows & Screaming Mouth
                const browLift = 0.18 + this.fearLevel * 0.035;
                const browTilt = 0.22 + this.fearLevel * 0.32;
                this.leftBrow.position.y = browLift;
                this.rightBrow.position.y = browLift;
                this.leftBrow.rotation.z = browTilt;
                this.rightBrow.rotation.z = -browTilt;

                // Mouth opens into a trembling scared "O" as fear rises
                const mouthOpenY = 0.32 + this.fearLevel * 0.95 + Math.sin(this.animTime * 38) * 0.12 * this.fearLevel;
                const mouthOpenX = 0.85 - this.fearLevel * 0.15;
                this.mouth.scale.set(mouthOpenX, mouthOpenY, 1);

                // 9. Animated sweat drop trickling down temple when scared
                if (this.fearLevel > 0.48) {
                    this.sweatDrop.visible = true;
                    const dropCycle = (this.animTime * 2.2) % 1;
                    this.sweatDrop.position.y = 0.20 - dropCycle * 0.22;
                    this.sweatDrop.scale.setScalar(Math.sin(dropCycle * Math.PI) * 1.15);
                } else {
                    this.sweatDrop.visible = false;
                }
            }

            // Triggered when a bullet or fast-moving prop hits this man
            triggerHit(impulseDir, speed = 15) {
                if (this.hit) return;
                this.hit = true;

                sound.playEnemyHit();

                // Launch ragdoll backward and upward with realistic physics
                this.vel.set(
                    impulseDir.x * (speed * 0.48) + (Math.random() - 0.5) * 3,
                    Math.max(5.5, impulseDir.y * (speed * 0.35) + 6.2),
                    (Math.random() - 0.5) * 4.5
                );

                this.rotVel.set(
                    (Math.random() - 0.5) * 10,
                    (Math.random() - 0.5) * 8,
                    -Math.sign(impulseDir.x || 1) * (8 + Math.random() * 6)
                );

                this.limbFlailSpeed = 18;

                // If this man was holding up a prop (like the top burger bun!), release it to gravity
                if (this.linkedProp) {
                    this.linkedProp.dynamic = true;
                    this.linkedProp.vel.y = 2.0;
                    this.linkedProp.angVel = (Math.random() - 0.5) * 2.5;
                }

                // Flatten eyes into knocked-out expression
                this.leftEye.scale.set(1.3, 0.22, 1);
                this.rightEye.scale.set(1.3, 0.22, 1);
                this.sweatDrop.visible = false;
            }

            update(dt, gunObj, activeBullets) {
                this.animTime += dt;

                if (!this.hit) {
                    // Execute unique level task animation!
                    const t = this.animTime;
                    switch (this.task) {
                        case 'lift_bun': {
                            // Pressing the giant burger top bun up and down!
                            const press = Math.sin(t * 4.2) * 0.16;
                            this.torso.position.y = 1.32 + press * 0.5;
                            this.leftArmPivot.rotation.z = -2.65 - press * 0.6;
                            this.rightArmPivot.rotation.z = 2.45 + press * 0.6;
                            this.leftLegPivot.rotation.z = -0.18;
                            this.rightLegPivot.rotation.z = 0.18;
                            if (this.linkedProp && !this.linkedProp.dynamic) {
                                this.linkedProp.mesh.position.y = this.linkedProp.baseY + press;
                            }
                            break;
                        }
                        case 'fries_wave': {
                            // Inside the fries box waving both hands overhead excitedly (Matches yellow guy in screenshot!)
                            const jump = Math.abs(Math.sin(t * 5.5)) * 0.22;
                            this.torso.position.y = 1.35 + jump;
                            this.leftArmPivot.rotation.z = -2.85 + Math.sin(t * 9) * 0.28;
                            this.rightArmPivot.rotation.z = 2.85 + Math.cos(t * 9) * 0.28;
                            this.head.rotation.z = Math.sin(t * 5.5) * 0.12;
                            break;
                        }
                        case 'squat': {
                            // Rapid gym squats
                            const sq = Math.sin(t * 5) * 0.28;
                            this.torso.position.y = 1.2 + sq;
                            this.leftLegPivot.rotation.x = sq * 1.2;
                            this.rightLegPivot.rotation.x = sq * 1.2;
                            this.leftArmPivot.rotation.x = -1.4 + sq;
                            this.rightArmPivot.rotation.x = -1.4 + sq;
                            break;
                        }
                        case 'dance': {
                            // Energetic twist & disco dance
                            this.torso.rotation.y = Math.sin(t * 6) * 0.35;
                            this.torso.position.y = 1.35 + Math.abs(Math.cos(t * 6)) * 0.18;
                            this.leftArmPivot.rotation.z = -2.2 + Math.sin(t * 6) * 0.8;
                            this.rightArmPivot.rotation.z = 1.2 + Math.cos(t * 6) * 0.8;
                            this.leftLegPivot.rotation.z = -0.25 + Math.sin(t * 6) * 0.2;
                            this.rightLegPivot.rotation.z = 0.25 + Math.cos(t * 6) * 0.2;
                            break;
                        }
                        case 'hammer': {
                            // Construction hammering motion
                            this.rightArmPivot.rotation.x = -1.6 + Math.sin(t * 10) * 0.95;
                            this.leftArmPivot.rotation.z = -0.6;
                            this.torso.rotation.x = Math.sin(t * 10) * 0.12;
                            break;
                        }
                        case 'juggle': {
                            // Alternating arm circles + hopping
                            this.leftArmPivot.rotation.x = -1.2 + Math.sin(t * 8) * 0.7;
                            this.rightArmPivot.rotation.x = -1.2 + Math.cos(t * 8) * 0.7;
                            this.torso.position.y = 1.35 + Math.abs(Math.sin(t * 4)) * 0.15;
                            break;
                        }
                        default: {
                            // Jumping jacks
                            const jj = Math.sin(t * 6);
                            this.torso.position.y = 1.35 + Math.abs(jj) * 0.2;
                            this.leftArmPivot.rotation.z = -1.6 - jj * 1.2;
                            this.rightArmPivot.rotation.z = 1.6 + jj * 1.2;
                            this.leftLegPivot.rotation.z = -0.25 - Math.max(0, jj) * 0.35;
                            this.rightLegPivot.rotation.z = 0.25 + Math.max(0, jj) * 0.35;
                        }
                    }

                    // Update realistic fearful eye tracking toward the gun & bullets!
                    this.updateEyeTracking(dt, gunObj, activeBullets);
                } else {
                    // Full Ragdoll Physics Simulation after being hit!
                    this.vel.y -= 19.5 * dt;
                    this.pos.addScaledVector(this.vel, dt);

                    this.root.rotation.x += this.rotVel.x * dt;
                    this.root.rotation.y += this.rotVel.y * dt;
                    this.root.rotation.z += this.rotVel.z * dt;

                    // Flail arms and legs organically
                    this.limbFlailSpeed *= Math.pow(0.92, dt * 60);
                    const f = this.animTime * this.limbFlailSpeed;
                    this.leftArmPivot.rotation.z = -1.5 + Math.sin(f) * 1.1;
                    this.rightArmPivot.rotation.z = 1.5 + Math.cos(f * 1.1) * 1.1;
                    this.leftLegPivot.rotation.x = Math.sin(f * 0.9) * 0.8;
                    this.rightLegPivot.rotation.x = Math.cos(f * 0.9) * 0.8;

                    // Floor collision for ragdoll
                    const groundY = 0.35;
                    if (this.pos.y <= groundY) {
                        this.pos.y = groundY;
                        if (Math.abs(this.vel.y) > 2.0) {
                            sound.playPropBounce(0.35);
                            this.vel.y = -this.vel.y * 0.38;
                            this.vel.x *= 0.72;
                            this.vel.z *= 0.72;
                            this.rotVel.multiplyScalar(0.65);
                        } else {
                            this.vel.y = 0;
                            this.vel.x *= 0.82;
                            this.vel.z *= 0.82;
                            this.rotVel.multiplyScalar(0.75);
                            // Settle flat on the floor
                            this.root.rotation.x += (Math.PI / 2 - this.root.rotation.x) * 6 * dt;
                        }
                    }

                    this.group.position.copy(this.pos);
                }
            }

            // World-space bounding center for bullet impact checks
            getHitCenter() {
                return new THREE.Vector3(
                    this.pos.x,
                    this.pos.y + 1.25 * this.scale,
                    this.pos.z
                );
            }

            destroy() {
                scene.remove(this.group);
            }
        }

        /* ============================================================================
         * 6. 3D LEVEL PROPS & SCENE ASSET BUILDERS
         * ============================================================================ */
        class LevelProp {
            constructor(mesh, pos, radius, dynamic = false, heightOffset = 0.6) {
                this.mesh = mesh;
                this.mesh.position.copy(pos);
                this.basePos = pos.clone();
                this.baseY = pos.y;
                this.radius = radius;
                this.heightOffset = heightOffset;
                this.dynamic = dynamic;
                this.vel = new THREE.Vector3(0, 0, 0);
                this.angVel = 0;
                this.shakeTimer = 0;
                this.shakeDir = new THREE.Vector3();
                scene.add(this.mesh);
            }

            // World-space center of the prop for accurate bullet collision
            getHitCenter() {
                return new THREE.Vector3(
                    this.mesh.position.x,
                    this.mesh.position.y + (this.dynamic ? 0 : this.heightOffset),
                    this.mesh.position.z
                );
            }

            applyImpulse(dir, force = 6) {
                // Play the bullet hit sound when any asset is struck by a bullet
                sound.playBulletHit('asset');
                if (this.dynamic) {
                    this.vel.x += dir.x * force;
                    this.vel.y += Math.max(2.5, dir.y * force + 3.0);
                    this.angVel += (Math.random() - 0.5) * 6;
                } else {
                    // Stationary level assets shudder/jolt realistically when hit by a bullet
                    this.shakeTimer = 0.18;
                    this.shakeDir.copy(dir);
                }
            }

            update(dt) {
                if (this.shakeTimer > 0 && !this.dynamic) {
                    this.shakeTimer = Math.max(0, this.shakeTimer - dt);
                    const jolt = Math.sin(this.shakeTimer * 85) * (this.shakeTimer / 0.18) * 0.14;
                    this.mesh.position.x = this.basePos.x + this.shakeDir.x * jolt;
                    this.mesh.rotation.z = -this.shakeDir.x * jolt * 0.45;
                    if (this.shakeTimer === 0) {
                        this.mesh.position.x = this.basePos.x;
                        this.mesh.rotation.z = 0;
                    }
                }

                if (!this.dynamic) return;
                this.vel.y -= 18.0 * dt;
                this.mesh.position.x += this.vel.x * dt;
                this.mesh.position.y += this.vel.y * dt;
                this.mesh.rotation.z += this.angVel * dt;

                const minY = this.radius * 0.45;
                if (this.mesh.position.y <= minY) {
                    this.mesh.position.y = minY;
                    if (Math.abs(this.vel.y) > 1.8) {
                        this.vel.y = -this.vel.y * 0.35;
                        this.vel.x *= 0.78;
                        this.angVel *= 0.7;
                    } else {
                        this.vel.y = 0;
                        this.vel.x *= 0.85;
                        this.angVel *= 0.8;
                    }
                }
            }

            destroy() {
                scene.remove(this.mesh);
            }
        }

        // Helper to build the exact Roast Chicken prop on the left of the screenshot!

            leg1.rotation.z = 0.55;

            leg2.position.z = -0.14;
