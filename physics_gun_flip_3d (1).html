        // Helper to build the Giant Sesame Top Bun (Held overhead by the Red Stickman!)
        function createBurgerTopBunMesh() {
            const group = new THREE.Group();
            const topGeo = new THREE.SphereGeometry(1.45, 28, 18, 0, Math.PI * 2, 0, Math.PI * 0.55);
            topGeo.scale(1, 0.72, 1);
            const bunMat = new THREE.MeshToonMaterial({ color: 0xf5ab18 });
            const topBun = new THREE.Mesh(topGeo, bunMat);
            topBun.castShadow = true;
            group.add(topBun);

            // Flat underside of bun
            const bottomCap = new THREE.Mesh(
                new THREE.CircleGeometry(1.42, 28),
                new THREE.MeshToonMaterial({ color: 0xfde68a })
            );
            bottomCap.rotation.x = Math.PI / 2;
            group.add(bottomCap);

            // Brown sesame seeds scattered on top
            const seedMat = new THREE.MeshBasicMaterial({ color: 0x854d0e });
            const seedGeo = new THREE.SphereGeometry(0.065, 8, 8);
            seedGeo.scale(1.4, 0.6, 0.9);
            for (let i = 0; i < 16; i++) {
                const angle = (i / 16) * Math.PI * 2 + (i % 2) * 0.3;
                const r = 0.45 + (i % 3) * 0.34;
                const seed = new THREE.Mesh(seedGeo, seedMat);
                seed.position.set(
                    Math.cos(angle) * r,
                    0.88 - r * 0.32,
                    Math.sin(angle) * r
                );
                seed.rotation.y = angle;
                group.add(seed);
            }
            return group;
        }

        // Helper to build the Red & Yellow Striped French Fries Box from the screenshot
        function createFriesCartonMesh() {
            const group = new THREE.Group();
            const segments = 20;
            const radiusTop = 1.55;
            const radiusBottom = 1.25;
            const height = 2.05;

            for (let i = 0; i < segments; i++) {
                const thetaStart = (i / segments) * Math.PI * 2;
                const thetaLength = (1 / segments) * Math.PI * 2 + 0.02;
                const stripeGeo = new THREE.CylinderGeometry(
                    radiusTop,
                    radiusBottom,
                    height,
                    4,
                    1,
                    false,
                    thetaStart,
                    thetaLength
                );
                const isRed = i % 2 === 0;
                const mat = new THREE.MeshToonMaterial({ color: isRed ? 0xe0352b : 0xfacc15 });
                const slice = new THREE.Mesh(stripeGeo, mat);
                slice.position.y = height / 2;
                slice.castShadow = true;
                slice.receiveShadow = true;
                group.add(slice);
            }

            // Tall golden fries arranged around the carton
            const fryMat = new THREE.MeshToonMaterial({ color: 0xffee00 });
            for (let i = 0; i < 18; i++) {
                const angle = (i / 18) * Math.PI * 2;
                // Leave a small front opening for the yellow man to wave clearly!
                const r = (i % 2 === 0) ? 1.05 : 0.78;
                const fryH = 1.7 + (i % 3) * 0.35;
                const fryGeo = new THREE.BoxGeometry(0.26, fryH, 0.22);
                const fry = new THREE.Mesh(fryGeo, fryMat);
                fry.position.set(
                    Math.cos(angle) * r,
                    1.85 + (i % 2) * 0.2,
                    Math.sin(angle) * r - 0.15
                );
                fry.rotation.z = (Math.random() - 0.5) * 0.22;
                fry.rotation.x = (Math.random() - 0.5) * 0.18;
                fry.castShadow = true;
                group.add(fry);
            }

            return group;
        }

        /* ============================================================================
         * 7. BULLET PROJECTILES, SHELL CASINGS & HIT PARTICLES
         * ============================================================================ */
        const bullets = [];
        const particles = [];

        function spawnBullet(pos, dir) {
            const group = new THREE.Group();
            group.position.copy(pos);

            // Glowing golden bullet head
            const bulletGeo = new THREE.CylinderGeometry(0.08, 0.1, 0.48, 10);
            bulletGeo.rotateZ(-Math.PI / 2);
            const bulletMat = new THREE.MeshBasicMaterial({ color: 0xfacc15 });
            const mesh = new THREE.Mesh(bulletGeo, bulletMat);
            group.add(mesh);

            // Bright tracer trail
            const trailGeo = new THREE.CylinderGeometry(0.02, 0.09, 1.3, 8);
            trailGeo.rotateZ(-Math.PI / 2);
            trailGeo.translate(-0.7, 0, 0);
            const trailMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.85 });
            const trail = new THREE.Mesh(trailGeo, trailMat);
            group.add(trail);

            group.rotation.z = Math.atan2(dir.y, dir.x);
            scene.add(group);

            bullets.push({
                mesh: group,
                pos: pos.clone(),
                vel: dir.clone().multiplyScalar(32), // Fast, snappy bullet speed
                life: 2.2
            });

            // Spawn muzzle flash + brass shell casing
            spawnParticles(pos, 0xfef08a, 8, 5);
        }

        function spawnParticles(pos, colorHex, count = 14, speed = 7) {
            const geo = new THREE.SphereGeometry(0.1, 8, 8);
            const mat = new THREE.MeshBasicMaterial({ color: colorHex });
            for (let i = 0; i < count; i++) {
                const p = new THREE.Mesh(geo, mat);
                p.position.copy(pos);
                scene.add(p);
                particles.push({
                    mesh: p,
                    vel: new THREE.Vector3(
                        (Math.random() - 0.5) * speed * 1.6,
                        Math.random() * speed + 2,
                        (Math.random() - 0.5) * speed
                    ),
                    life: 0.55 + Math.random() * 0.35
                });
            }
        }

        /* ============================================================================
         * 8. GAME STATE & SCENE GENERATOR (2 TO 5 MEN PER LEVEL)
         * ============================================================================ */
        const gun = new PhysicsGun();
        let activeTargets = [];
        let activeProps = [];
        let currentLevelIndex = 0;
        let currentDisplayLevel = 51; // Starts at Level 51 like the screenshot, increments 52, 53...
        let totalHits = 93;
        let totalCoins = 1033;
        let shotsThisLevel = 0;
        let levelCleared = false;

        function clearLevelEntities() {
            activeTargets.forEach(t => t.destroy());
            activeTargets = [];
            activeProps.forEach(p => p.destroy());
            activeProps = [];
            bullets.forEach(b => scene.remove(b.mesh));
            bullets.length = 0;
        }

        function updateHUD() {
            document.getElementById('level-display').textContent = `Level ${currentDisplayLevel}`;
            document.getElementById('total-hits-count').textContent = totalHits;
            document.getElementById('total-coins-count').textContent = totalCoins;

            // Update remaining targets dots
            const dotsContainer = document.getElementById('targets-dots');
            dotsContainer.innerHTML = '';
            activeTargets.forEach(t => {
                const dot = document.createElement('span');
                const hex = '#' + t.color.toString(16).padStart(6, '0');
                dot.className = `w-4 h-4 rounded-full border-2 border-slate-900 transition-transform duration-300 ${t.hit ? 'opacity-25 scale-75 bg-slate-400' : 'scale-100'}`;
                if (!t.hit) dot.style.backgroundColor = hex;
                dotsContainer.appendChild(dot);
            });
        }

        function spawnFloatingText(worldPos, text, color = '#10b981') {
            const vector = worldPos.clone().project(camera);
            const x = (vector.x * 0.5 + 0.5) * window.innerWidth;
            const y = (-(vector.y * 0.5) + 0.5) * window.innerHeight;

            const el = document.createElement('div');
            el.className = 'absolute font-extrabold text-xl sm:text-2xl stroke-text pointer-events-none transition-all duration-700 ease-out';
            el.style.left = `${x}px`;
            el.style.top = `${y}px`;
            el.style.color = color;
            el.textContent = text;

            const container = document.getElementById('floating-popups');
            container.appendChild(el);

            requestAnimationFrame(() => {
                el.style.transform = 'translate(-50%, -65px) scale(1.15)';
                el.style.opacity = '0';
            });
            setTimeout(() => el.remove(), 750);
        }

        function loadLevel(index, customDisplayNum = null) {
            clearLevelEntities();
            levelCleared = false;
            shotsThisLevel = 0;
            document.getElementById('victory-modal').classList.add('hidden');

            const preset = LEVEL_PRESETS[index % LEVEL_PRESETS.length];
            currentLevelIndex = index;
            if (customDisplayNum !== null) {
                currentDisplayLevel = customDisplayNum;
            }

            // Apply room color palette
            scene.background.setHex(preset.wallLeft);
            leftWallMat.color.setHex(preset.wallLeft);
            rightWallMat.color.setHex(preset.wallRight);
            floorMat.color.setHex(preset.floor);
            document.getElementById('scene-subtitle').textContent = preset.title;

            // Reset Gun on the left side
            gun.reset(-2.2, 1.05);

            const theme = preset.themeType;

            if (theme === 'fastfood') {
                // EXACT RECREATION OF SCREENSHOT + DYNAMIC PHYSICS!
                // 1. Roast Chicken on the left (-4.8, 0.42, 0)
                const chickenMesh = createRoastChickenMesh();
                activeProps.push(new LevelProp(chickenMesh, new THREE.Vector3(-4.8, 0.42, 0), 0.7, true));

                // 2. Giant Burger Base at (0.35, 0, 0)
                const burgerBase = createBurgerBaseMesh();
                activeProps.push(new LevelProp(burgerBase, new THREE.Vector3(0.35, 0, 0), 1.3, false));

                // 3. Giant Sesame Top Bun above the Red Man
                const topBunMesh = createBurgerTopBunMesh();
                const topBunProp = new LevelProp(topBunMesh, new THREE.Vector3(0.35, 2.95, 0), 1.25, false);
                activeProps.push(topBunProp);

                // 4. Red Man standing on the burger patty lifting the sesame top bun!
                activeTargets.push(new TargetMan({
                    color: 0xe61919,
                    task: 'lift_bun',
                    position: new THREE.Vector3(0.35, 0.96, 0),
                    scale: 1.0,
                    linkedProp: topBunProp
                }));

                // 5. Giant French Fries Carton on the right (2.95, 0, -0.3)
                const friesMesh = createFriesCartonMesh();
                activeProps.push(new LevelProp(friesMesh, new THREE.Vector3(2.95, 0, -0.3), 1.5, false));

                // 6. Yellow Man inside the French Fries waving both hands overhead!
                activeTargets.push(new TargetMan({
                    color: 0xffee00,
                    task: 'fries_wave',
                    position: new THREE.Vector3(2.65, 1.45, 0),
                    scale: 0.98
                }));

            } else if (theme === 'gym') {
                // 3 MEN DOING DIFFERENT WORKOUTS!
                // Gym Pedestal 1 (Blue Plate Stack)
                const matStack = new THREE.Mesh(
                    new THREE.BoxGeometry(2.2, 1.1, 1.8),
                    new THREE.MeshToonMaterial({ color: 0x3b82f6 })
                );
                matStack.castShadow = true;
                activeProps.push(new LevelProp(matStack, new THREE.Vector3(0.2, 0.55, 0), 1.1, false));

                // Giant Kettlebell / Medicine Ball
                const ballMesh = new THREE.Mesh(
                    new THREE.SphereGeometry(0.95, 22, 22),
                    new THREE.MeshToonMaterial({ color: 0xec4899 })
                );
                ballMesh.castShadow = true;
                activeProps.push(new LevelProp(ballMesh, new THREE.Vector3(3.1, 0.95, 0), 0.95, true));

                // High Gym Box on Far Right
                const tallBox = new THREE.Mesh(
                    new THREE.CylinderGeometry(1.1, 1.2, 2.4, 20),
                    new THREE.MeshToonMaterial({ color: 0x10b981 })
                );
                tallBox.castShadow = true;
                activeProps.push(new LevelProp(tallBox, new THREE.Vector3(5.8, 1.2, 0), 1.2, false));

                // 3 Men doing squats, balance, and jumping jacks
                activeTargets.push(new TargetMan({
                    color: 0x2563eb,
                    task: 'squat',
                    position: new THREE.Vector3(0.2, 1.1, 0),
                    scale: 0.98
                }));
                activeTargets.push(new TargetMan({
                    color: 0xf97316,
                    task: 'juggle',
                    position: new THREE.Vector3(3.1, 1.88, 0),
                    scale: 0.95
                }));
                activeTargets.push(new TargetMan({
                    color: 0x84cc16,
                    task: 'jumping_jacks',
                    position: new THREE.Vector3(5.8, 2.4, 0),
                    scale: 0.98
                }));

            } else if (theme === 'construction') {
                // 3 MEN ON SCAFFOLDING & BRICK TOWERS
                const beam1 = new THREE.Mesh(
                    new THREE.BoxGeometry(2.1, 1.6, 1.6),
                    new THREE.MeshToonMaterial({ color: 0xf59e0b })
                );
                beam1.castShadow = true;
                activeProps.push(new LevelProp(beam1, new THREE.Vector3(0.4, 0.8, 0), 1.1, false));

                const steelCrate = new THREE.Mesh(
                    new THREE.BoxGeometry(1.8, 2.8, 1.8),
                    new THREE.MeshToonMaterial({ color: 0x64748b })
                );
                steelCrate.castShadow = true;
                activeProps.push(new LevelProp(steelCrate, new THREE.Vector3(3.3, 1.4, 0), 1.4, false));

                const brickPillar = new THREE.Mesh(
                    new THREE.CylinderGeometry(1.0, 1.0, 1.2, 16),
                    new THREE.MeshToonMaterial({ color: 0xdc2626 })
                );
                brickPillar.castShadow = true;
                activeProps.push(new LevelProp(brickPillar, new THREE.Vector3(6.0, 0.6, 0), 1.0, true));

                activeTargets.push(new TargetMan({
                    color: 0x06b6d4,
                    task: 'hammer',
                    position: new THREE.Vector3(0.4, 1.6, 0)
                }));
                activeTargets.push(new TargetMan({
                    color: 0xfacc15,
                    task: 'fries_wave',
                    position: new THREE.Vector3(3.3, 2.8, 0)
                }));
                activeTargets.push(new TargetMan({
                    color: 0xa855f7,
                    task: 'dance',
                    position: new THREE.Vector3(6.0, 1.2, 0)
                }));

            } else if (theme === 'bakery') {
                // 4 MEN ON GIANT WEDDING CAKE, CUPCAKE & COFFEE MUG
                const tier1 = new THREE.Mesh(
                    new THREE.CylinderGeometry(1.7, 1.7, 1.2, 24),
                    new THREE.MeshToonMaterial({ color: 0xfef08a })
                );
                const tier2 = new THREE.Mesh(
                    new THREE.CylinderGeometry(1.2, 1.2, 1.1, 24),
                    new THREE.MeshToonMaterial({ color: 0xf472b6 })
                );
                tier2.position.y = 1.15;
                tier1.add(tier2);
                tier1.castShadow = true;
                activeProps.push(new LevelProp(tier1, new THREE.Vector3(1.1, 0.6, 0), 1.4, false));

                const mug = new THREE.Mesh(
                    new THREE.CylinderGeometry(1.15, 1.0, 2.0, 22),
                    new THREE.MeshToonMaterial({ color: 0x38bdf8 })
                );
                mug.castShadow = true;
                activeProps.push(new LevelProp(mug, new THREE.Vector3(4.5, 1.0, 0), 1.2, false));

                const donut = new THREE.Mesh(
                    new THREE.CylinderGeometry(1.0, 1.0, 0.7, 20),
                    new THREE.MeshToonMaterial({ color: 0xf97316 })
                );
                activeProps.push(new LevelProp(donut, new THREE.Vector3(-0.9, 0.35, 0), 0.7, true));

                activeTargets.push(new TargetMan({
                    color: 0xec4899,
                    task: 'dance',
                    position: new THREE.Vector3(-0.9, 0.7, 0),
                    scale: 0.9
                }));
                activeTargets.push(new TargetMan({
                    color: 0x22c55e,
                    task: 'fries_wave',
                    position: new THREE.Vector3(1.1, 2.3, 0),
                    scale: 0.92
                }));
                activeTargets.push(new TargetMan({
                    color: 0xef4444,
                    task: 'juggle',
                    position: new THREE.Vector3(4.5, 2.0, 0),
                    scale: 0.92
                }));
                activeTargets.push(new TargetMan({
                    color: 0x6366f1,
                    task: 'squat',
                    position: new THREE.Vector3(6.6, 0.0, 0),
                    scale: 0.95
                }));

            } else if (theme === 'circus') {
                // 4 MEN IN CIRCUS SHOWDOWN
                const colors = [0xef4444, 0xfacc15, 0x3b82f6, 0x10b981];
                const tasks = ['juggle', 'dance', 'fries_wave', 'squat'];
                const heights = [1.1, 2.3, 1.5, 2.9];

                for (let i = 0; i < 4; i++) {
                    const xPos = -0.2 + i * 2.2;
                    const h = heights[i];
                    const pillar = new THREE.Mesh(
                        new THREE.CylinderGeometry(0.85, 0.95, h, 20),
                        new THREE.MeshToonMaterial({ color: colors[(i + 1) % colors.length] })
                    );
                    pillar.castShadow = true;
                    activeProps.push(new LevelProp(pillar, new THREE.Vector3(xPos, h / 2, 0), 0.9, false));

                    activeTargets.push(new TargetMan({
                        color: colors[i],
                        task: tasks[i],
                        position: new THREE.Vector3(xPos, h, 0),
                        scale: 0.92
                    }));
                }

            } else {
                // 5 MEN TROPICAL BEACH PARTY SCENE!
                const colors = [0xff1e1e, 0xfacc15, 0x06b6d4, 0xa855f7, 0x22c55e];
                const tasks = ['dance', 'fries_wave', 'squat', 'juggle', 'jumping_jacks'];
                const heights = [0.8, 1.8, 1.1, 2.5, 1.4];

                for (let i = 0; i < 5; i++) {
                    const xPos = -0.6 + i * 1.85;
                    const h = heights[i];
                    const block = new THREE.Mesh(
                        new THREE.BoxGeometry(1.35, h, 1.35),
                        new THREE.MeshToonMaterial({ color: colors[(i + 2) % colors.length] })
                    );
                    block.castShadow = true;
                    activeProps.push(new LevelProp(block, new THREE.Vector3(xPos, h / 2, 0), 0.85, i % 2 === 0));

                    activeTargets.push(new TargetMan({
                        color: colors[i],
                        task: tasks[i],
                        position: new THREE.Vector3(xPos, h, 0),
                        scale: 0.88
                    }));
                }
            }

            updateHUD();
        }

        /* ============================================================================
         * 9. INPUT HANDLING (TAP / CLICK / SPACE TO SHOOT)
         * ============================================================================ */
        function fireWeapon() {
            if (levelCleared) return;

            sound.playGunshot();
            shotsThisLevel++;

            const { muzzlePos, dir } = gun.shoot();
            spawnBullet(muzzlePos, dir);

            // Hide initial tutorial badge after first shot
            const hint = document.getElementById('tap-hint');
            if (hint) hint.style.opacity = '0.35';
        }

        canvas.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            fireWeapon();
        });

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                fireWeapon();
            } else if (e.code === 'KeyR') {
                loadLevel(currentLevelIndex, currentDisplayLevel);
            }
        });

        // UI Button Listeners
        document.getElementById('btn-restart').addEventListener('click', (e) => {
            e.stopPropagation();
            loadLevel(currentLevelIndex, currentDisplayLevel);
        });

        document.getElementById('btn-sound').addEventListener('click', (e) => {
            e.stopPropagation();
            const isMuted = sound.toggleMute();
            document.getElementById('icon-sound-on').classList.toggle('hidden', isMuted);
            document.getElementById('icon-sound-off').classList.toggle('hidden', !isMuted);
        });

        document.getElementById('btn-skin').addEventListener('click', (e) => {
            e.stopPropagation();
            const skinName = gun.cycleSkin();
            document.getElementById('skin-badge').textContent = skinName.split(' ')[0].toUpperCase();
            sound.playPropBounce(0.7);
        });

        document.getElementById('btn-next-level').addEventListener('click', (e) => {
            e.stopPropagation();
            currentDisplayLevel++;
            loadLevel(currentLevelIndex + 1, currentDisplayLevel);
        });

        // Scene / Level Picker Modal
        const pickerModal = document.getElementById('level-picker-modal');
        const levelGrid = document.getElementById('level-grid');

        LEVEL_PRESETS.forEach((p, idx) => {
            const btn = document.createElement('button');
            btn.className = 'cartoon-box p-3 rounded-2xl text-left hover:bg-amber-50 flex flex-col justify-between';
            btn.innerHTML = `
                <span class="text-xs font-extrabold text-purple-600 uppercase">Level ${p.displayNum}</span>
                <span class="text-sm font-extrabold text-slate-900 leading-tight mt-1">${p.title}</span>
            `;
            btn.addEventListener('click', () => {
                pickerModal.classList.add('hidden');
                loadLevel(idx, p.displayNum);
            });
            levelGrid.appendChild(btn);
        });

        document.getElementById('btn-level-select').addEventListener('click', (e) => {
            e.stopPropagation();
            pickerModal.classList.remove('hidden');
        });

        document.getElementById('btn-close-picker').addEventListener('click', (e) => {
            e.stopPropagation();
            pickerModal.classList.add('hidden');
        });

        /* ============================================================================
         * 10. MAIN PHYSICS & COLLISION LOOP
         * ============================================================================ */
        function checkVictoryCondition() {
            if (levelCleared) return;
            const remaining = activeTargets.filter(t => !t.hit).length;
            if (remaining === 0 && activeTargets.length > 0) {
                levelCleared = true;
                const earnedCoins = activeTargets.length * 25;
                totalCoins += earnedCoins;
                updateHUD();

                setTimeout(() => {
                    sound.playVictory();
                    document.getElementById('stat-shots').textContent = shotsThisLevel;
                    document.getElementById('stat-coins').textContent = `+${earnedCoins}`;
                    document.getElementById('victory-summary').textContent =
                        `All ${activeTargets.length} targets knocked down in ${LEVEL_PRESETS[currentLevelIndex % LEVEL_PRESETS.length].title}!`;
                    document.getElementById('victory-modal').classList.remove('hidden');
                }, 950);
            }
        }

        let lastTime = performance.now();

        function animate(now = performance.now()) {
            requestAnimationFrame(animate);

            const dt = Math.min(0.033, (now - lastTime) / 1000);
            lastTime = now;

            // 1. Update Gun Physics
            gun.update(dt);

            // 2. Update Props Physics
            for (let i = 0; i < activeProps.length; i++) {
                activeProps[i].update(dt);
            }

            // 3. Update Animated Men / Ragdolls (passing gun & bullets for fearful eye tracking)
            for (let i = 0; i < activeTargets.length; i++) {
                activeTargets[i].update(dt, gun, bullets);
            }

            // 4. Update Bullets & Check Collisions with Men and Props
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                const prevPos = b.pos.clone();
                b.pos.addScaledVector(b.vel, dt);
                b.mesh.position.copy(b.pos);
                b.life -= dt;

                let bulletRemoved = false;

                // Floor hit check
                if (b.pos.y <= 0.15) {
                    spawnParticles(b.pos, 0xffffff, 6, 4);
                    sound.playBulletHit('asset');
                    scene.remove(b.mesh);
                    bullets.splice(i, 1);
                    continue;
                }

                // Check collision against each target man (segment-sphere check for fast bullets)
                for (let j = 0; j < activeTargets.length; j++) {
                    const target = activeTargets[j];
                    if (target.hit) continue;

                    const center = target.getHitCenter();
                    const seg = b.pos.clone().sub(prevPos);
                    const segLen = seg.length();
                    const segDir = seg.clone().normalize();
                    const toCenter = center.clone().sub(prevPos);
                    const proj = Math.max(0, Math.min(segLen, toCenter.dot(segDir)));
                    const closestPoint = prevPos.clone().addScaledVector(segDir, proj);

                    // Generous hitbox radius covering head, torso, and legs
                    const dist = closestPoint.distanceTo(center);
                    if (dist < 1.18 * target.scale) {
                        target.triggerHit(segDir, 18);
                        spawnParticles(closestPoint, target.color, 18, 8);

                        totalHits++;
                        totalCoins += 10;
                        updateHUD();
                        spawnFloatingText(center, 'HIT! +10', '#facc15');
                        checkVictoryCondition();

                        scene.remove(b.mesh);
                        bullets.splice(i, 1);
                        bulletRemoved = true;
                        break;
                    }
                }

                if (bulletRemoved) continue;

                // Check collision against all level assets/props (both dynamic and stationary props)
                for (let k = 0; k < activeProps.length; k++) {
                    const prop = activeProps[k];
                    const propCenter = prop.getHitCenter();
                    const seg = b.pos.clone().sub(prevPos);
                    const segLen = Math.max(0.0001, seg.length());
                    const segDir = seg.clone().divideScalar(segLen);
                    const toProp = propCenter.clone().sub(prevPos);
                    const proj = Math.max(0, Math.min(segLen, toProp.dot(segDir)));
                    const closestPt = prevPos.clone().addScaledVector(segDir, proj);

                    if (closestPt.distanceTo(propCenter) < prop.radius * 0.92) {
                        prop.applyImpulse(segDir, 6.5);
                        spawnParticles(closestPt, 0xfde047, 10, 5.5);
                        scene.remove(b.mesh);
                        bullets.splice(i, 1);
                        bulletRemoved = true;
                        break;
                    }
                }

                if (!bulletRemoved && b.life <= 0) {
                    scene.remove(b.mesh);
                    bullets.splice(i, 1);
                }
            }

            // 5. Update Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.vel.y -= 15 * dt;
                p.mesh.position.addScaledVector(p.vel, dt);
                p.life -= dt;
                p.mesh.scale.setScalar(Math.max(0.01, p.life * 1.5));
                if (p.life <= 0) {
                    scene.remove(p.mesh);
                    particles.splice(i, 1);
                }
            }

            // 6. Subtle smooth camera follow so the action always stays framed nicely
            const targetCamX = -1.5 + THREE.MathUtils.clamp(gun.pos.x * 0.12, -1.2, 1.5);
            camera.position.x += (targetCamX - camera.position.x) * 4 * dt;
            camera.lookAt(defaultLookAt);

            renderer.render(scene, camera);
        }

        // Responsive Canvas Resize Handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Initialize Level 1 (Displays "Level 51" scene from your screenshot first!) and start loop
        window.onload = function () {
            loadLevel(0, 51);
            animate();
        };
    </script>
</body>
</html>
